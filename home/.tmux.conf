# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true colour
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0          # remove Esc delay (important for vim)
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string '#h — #S — #W'

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Reloading ─────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Window / pane creation ────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Vim-style pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vim-style pane resizing ───────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window
bind Tab last-window

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# ── Session management ────────────────────────────────────────────────────────
bind S choose-session
bind N new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 260

set -g status-style              "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style         "fg=#313244"
set -g pane-active-border-style  "fg=#89b4fa"
set -g message-style             "bg=#313244,fg=#cdd6f4"
set -g message-command-style     "bg=#313244,fg=#cdd6f4"

# ── Left: session pill ────────────────────────────────────────────────────────
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e]#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "

# ── Windows ───────────────────────────────────────────────────────────────────
setw -g window-status-separator  " "
setw -g window-status-style      "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-bell-style "fg=#f38ba8,bold"

setw -g window-status-format         "#[fg=#6c7086,bg=#1e1e2e] #I #W "
setw -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[bg=#cba6f7,fg=#1e1e2e,bold] #I #W #[fg=#cba6f7,bg=#1e1e2e]"

# ── Right: info pills ─────────────────────────────────────────────────────────
# Each @pill_* is one segment. To remove a pill:
#   1. Comment out its set -g @pill_* line below
#   2. Delete its #{@pill_*} token from the status-right line at the bottom

# Battery — macOS only (pmset); comment out on Linux
set -g @pill_battery "#[fg=#a6e3a1,bg=#1e1e2e]#[bg=#a6e3a1,fg=#1e1e2e,bold]  #(pmset -g batt | grep -oE '[0-9]+%%' | head -1) #[fg=#a6e3a1,bg=#1e1e2e]"

# Load — 1-minute load average via uptime (instant, no top overhead)
set -g @pill_load "#[fg=#fab387,bg=#1e1e2e]#[bg=#fab387,fg=#1e1e2e,bold]  #(uptime | awk '{print $(NF-2)}' | tr -d ',') #[fg=#fab387,bg=#1e1e2e]"

# RAM — sum of all process RSS; fast approximation of memory pressure
set -g @pill_ram "#[fg=#94e2d5,bg=#1e1e2e]#[bg=#94e2d5,fg=#1e1e2e,bold]  #(ps -A -o rss | awk '{s+=$1} END {printf \"%%dG\", s/1048576}') #[fg=#94e2d5,bg=#1e1e2e]"

# Weather — current temperature from wttr.in (requires network; 3 s timeout)
set -g @pill_weather "#[fg=#89dceb,bg=#1e1e2e]#[bg=#89dceb,fg=#1e1e2e,bold]  #(curl -s --max-time 3 'wttr.in/?format=%%t' 2>/dev/null) #[fg=#89dceb,bg=#1e1e2e]"

# Git — branch of the active pane's directory; shows — when not in a git repo
set -g @pill_git "#[fg=#f2cdcd,bg=#1e1e2e]#[bg=#f2cdcd,fg=#1e1e2e,bold]  #(cd '#{pane_current_path}'; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '—') #[fg=#f2cdcd,bg=#1e1e2e]"

# Path — basename of the active pane's current directory
set -g @pill_path "#[fg=#f9e2af,bg=#1e1e2e]#[bg=#f9e2af,fg=#1e1e2e,bold]  #{b:pane_current_path} #[fg=#f9e2af,bg=#1e1e2e]"

# Time
set -g @pill_time "#[fg=#f5c2e7,bg=#1e1e2e]#[bg=#f5c2e7,fg=#1e1e2e,bold]  %H:%M #[fg=#f5c2e7,bg=#1e1e2e]"

# Date
set -g @pill_date "#[fg=#b4befe,bg=#1e1e2e]#[bg=#b4befe,fg=#1e1e2e,bold]  %d %b #[fg=#b4befe,bg=#1e1e2e]"

# Assemble — delete any #{@pill_*} token here to hide that segment
set -g status-right " #{@pill_battery} #{@pill_load} #{@pill_ram} #{@pill_weather} #{@pill_git} #{@pill_path} #{@pill_time} #{@pill_date}"

# ── Activity monitoring ───────────────────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity off
