# ── Prefix ────────────────────────────────────────────────────────────────────
set-option -g prefix C-b
bind-key C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"     # force true colour even if terminfo lacks Tc
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0          # remove Esc delay (important for vim)
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off          # programs may not rename windows via escape codes
setw -g automatic-rename on        # name each window after the program running in it

# Name windows after the running program, but show the current folder instead of a
# bare "zsh" for plain shell windows. The [tmux] and [dead] branches are tmux's own
# defaults, kept so copy-mode and dead panes still label themselves.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}#{?pane_dead,[dead],}'
set -g set-titles on
set -g set-titles-string '#h — #S — #W'

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Reloading ─────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Window / pane creation ────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── AI workspace ──────────────────────────────────────────────────────────────
# prefix A: new window named "dev" with nvim on the left, Claude Code top-right,
# a shell bottom-right. All three start in the directory you pressed A from.
# -n pins the name (turns off automatic-rename for this window on purpose).
bind A new-window -n dev -c "#{pane_current_path}" \; \
       send-keys 'nvim .' Enter \; \
       split-window -h -l 40% -c "#{pane_current_path}" \; \
       send-keys 'claude' Enter \; \
       split-window -v -l 50% -c "#{pane_current_path}" \; \
       select-pane -t 1

# ── Broadcast ─────────────────────────────────────────────────────────────────
# prefix b: toggle typing into every pane in this window at once. Never use it in
# a mixed window (nvim + claude + shell) — every key goes to all of them.
bind b setw synchronize-panes \; display "sync #{?pane_synchronized,ON,off}"

# ── Vim-style pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vim-style pane resizing ───────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window
bind Tab last-window

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# ── Session management ────────────────────────────────────────────────────────
bind S choose-session
bind N new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 260

set -g status-style              "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style         "fg=#313244"
set -g pane-active-border-style  "fg=#89b4fa"
set -g message-style             "bg=#313244,fg=#cdd6f4"
set -g message-command-style     "bg=#313244,fg=#cdd6f4"

# ── Left: session pill + transient badges ─────────────────────────────────────
# @badge_* are wrapped in #{?flag,...,} so the whole pill — rounded caps included —
# disappears when the flag is off. They live on the left so that appearing and
# disappearing never shifts the right-hand pills around.

# Prefix armed — lights up between pressing C-b and the next key
set -g @badge_prefix "#{?client_prefix,#[fg=#fab387#,bg=#1e1e2e]#[bg=#fab387#,fg=#1e1e2e#,bold]  PREFIX #[fg=#fab387#,bg=#1e1e2e] ,}"

# Panes synchronized — keystrokes go to EVERY pane in this window. Red on purpose.
set -g @badge_sync "#{?pane_synchronized,#[fg=#f38ba8#,bg=#1e1e2e]#[bg=#f38ba8#,fg=#1e1e2e#,bold]  SYNC #[fg=#f38ba8#,bg=#1e1e2e] ,}"

# Pane zoomed — the other panes are hidden, not gone
set -g @badge_zoom "#{?window_zoomed_flag,#[fg=#f9e2af#,bg=#1e1e2e]#[bg=#f9e2af#,fg=#1e1e2e#,bold]  ZOOM #[fg=#f9e2af#,bg=#1e1e2e] ,}"

set -g status-left "#[fg=#89b4fa,bg=#1e1e2e]#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[fg=#89b4fa,bg=#1e1e2e] #{T:@badge_prefix}#{T:@badge_zoom}#{T:@badge_sync}"

# ── Windows ───────────────────────────────────────────────────────────────────
setw -g window-status-separator  " "
setw -g window-status-style      "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-bell-style "fg=#f38ba8,bold"

setw -g window-status-format         "#[fg=#6c7086,bg=#1e1e2e] #I #W "
setw -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[bg=#cba6f7,fg=#1e1e2e,bold] #I #W #[fg=#cba6f7,bg=#1e1e2e]"

# ── Right: info pills ─────────────────────────────────────────────────────────
# Each @pill_* is one segment. To remove a pill:
#   1. Comment out its set -g @pill_* line below
#   2. Delete its #{T:@pill_*} token from the status-right line at the bottom
#
# The T: is required: status-right is expanded in one pass, so a bare
# #{@pill_*} would paste the pill's #(...) / #{...} / %H:%M in literally.

# Git — branch of the active pane's directory; shows — when not in a git repo
set -g @pill_git "#[fg=#f2cdcd,bg=#1e1e2e]#[bg=#f2cdcd,fg=#1e1e2e,bold]  #(cd '#{pane_current_path}' && git status --porcelain=v2 --branch 2>/dev/null | awk '/^# branch.head/{b=$3} /^# branch.ab/{a=$3;h=$4} /^[^#]/{d=1} END{if(b==\"\")printf \"—\"; else printf \"%%s%%s%%s%%s\",b,(d?\"*\":\"\"),(a!=\"+0\"?\" \"a:\"\"),(h!=\"-0\"?\" \"h:\"\")}' || echo '—') #[fg=#f2cdcd,bg=#1e1e2e]"

# Path — basename of the active pane's current directory
set -g @pill_path "#[fg=#f9e2af,bg=#1e1e2e]#[bg=#f9e2af,fg=#1e1e2e,bold]  #{b:pane_current_path} #[fg=#f9e2af,bg=#1e1e2e]"

# Time
set -g @pill_time "#[fg=#f5c2e7,bg=#1e1e2e]#[bg=#f5c2e7,fg=#1e1e2e,bold]  %H:%M #[fg=#f5c2e7,bg=#1e1e2e]"

# Date
set -g @pill_date "#[fg=#b4befe,bg=#1e1e2e]#[bg=#b4befe,fg=#1e1e2e,bold]  %d %b #[fg=#b4befe,bg=#1e1e2e]"

# Seattle — US job hunt is run from Taipei; the weekday matters, not just the hour
set -g @pill_seattle "#[fg=#89b4fa,bg=#1e1e2e]#[bg=#89b4fa,fg=#1e1e2e,bold]  #(TZ=America/Los_Angeles date +'%%H:%%M %%a') #[fg=#89b4fa,bg=#1e1e2e]"

# Assemble — delete any #{T:@pill_*} token here to hide that segment
set -g status-right " #{T:@pill_git} #{T:@pill_path} #{T:@pill_time} #{T:@pill_date} #{T:@pill_seattle}"

# ── Activity monitoring ───────────────────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity off
